<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>meme-cli quad editor</title>
<style>
  :root {
    --bg: #1a1b1e;
    --panel: #25262b;
    --ink: #e8e8ea;
    --muted: #9a9aa3;
    --accent: #e8519c;
    --accent2: #3dd6c6;
    --line: #3a3b42;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
  }
  body {
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 1rem;
    padding: 0.65rem 1rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 {
    margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: 0.02em;
  }
  header .hint { color: var(--muted); font-size: 0.85rem; }
  aside {
    border-right: 1px solid var(--line);
    background: var(--panel);
    padding: 0.75rem;
    overflow: auto;
    display: flex; flex-direction: column; gap: 0.75rem;
  }
  label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
  select, input[type="file"], button, textarea {
    width: 100%;
    font: inherit; color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.45rem 0.55rem;
  }
  button {
    cursor: pointer;
    background: #2f3138;
  }
  button:hover { border-color: var(--accent2); }
  button.primary {
    background: var(--accent2);
    color: #0b1c1a;
    border-color: transparent;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.05); }
  .row { display: flex; gap: 0.4rem; }
  .row button { flex: 1; }
  .mode {
    display: flex; gap: 0.35rem;
  }
  .mode label {
    flex: 1; margin: 0;
    display: flex; align-items: center; justify-content: center; gap: 0.35rem;
    padding: 0.4rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    color: var(--ink);
    font-size: 0.8rem;
  }
  .mode input { width: auto; accent-color: var(--accent2); }
  .status {
    font-size: 0.8rem; color: var(--muted);
    min-height: 2.4em;
  }
  .status strong { color: var(--accent2); }
  .points {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.75rem;
    color: var(--muted);
    white-space: pre-wrap;
  }
  textarea {
    min-height: 10rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.8rem;
    resize: vertical;
  }
  main {
    position: relative;
    overflow: auto;
    background:
      linear-gradient(45deg, #222 25%, transparent 25%) 0 0 / 16px 16px,
      linear-gradient(-45deg, #222 25%, transparent 25%) 0 0 / 16px 16px,
      #111;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 1rem;
  }
  .stage-wrap {
    position: relative;
    max-width: 100%;
    line-height: 0;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
  }
  .stage-wrap img {
    display: block;
    max-width: min(100%, 1100px);
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  canvas.overlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    cursor: crosshair;
  }
  .empty {
    color: var(--muted);
    padding: 3rem;
    text-align: center;
    line-height: 1.5;
  }
  #boxWrap[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>quad editor</h1>
  <span class="hint">Existing areas load from config · TL → TR → BR → BL · U undo · R reset · C copy</span>
</header>
<aside>
  <div>
    <label for="tmpl">Template</label>
    <select id="tmpl"><option value="">— load list —</option></select>
  </div>
  <div id="boxWrap" hidden>
    <label for="box">Text box</label>
    <select id="box"></select>
  </div>
  <div>
    <label for="file">Or drop / pick image</label>
    <input id="file" type="file" accept="image/*" />
  </div>
  <div>
    <label>Mode</label>
    <div class="mode">
      <label><input type="radio" name="mode" value="quad" checked /> 4-pt quad</label>
      <label><input type="radio" name="mode" value="para" /> 3-pt (imply BR)</label>
    </div>
  </div>
  <div class="row">
    <button type="button" id="undo">Undo</button>
    <button type="button" id="reset">Reset</button>
  </div>
  <button type="button" class="primary" id="copy">Copy YAML</button>
  <div class="status" id="status">Load a template — existing write areas are drawn automatically.</div>
  <div class="points" id="points"></div>
  <div>
    <label for="yaml">YAML</label>
    <textarea id="yaml" readonly placeholder="corners appear here…"></textarea>
  </div>
</aside>
<main id="main">
  <div class="empty" id="empty">Pick a template or drop an image to start marking corners.</div>
  <div class="stage-wrap" id="stage" hidden>
    <img id="img" alt="template background" />
    <canvas class="overlay" id="overlay"></canvas>
  </div>
</main>
<script>
(() => {
  const LABELS_QUAD = ["top-left", "top-right", "bottom-right", "bottom-left"];
  const LABELS_PARA = ["top-left", "top-right", "bottom-left"];
  const COLORS = ["#3dd6c6", "#e8519c", "#e8b84a", "#7aa2ff"];
  const OTHER_STROKE = "rgba(61, 214, 198, 0.55)";
  const OTHER_FILL = "rgba(61, 214, 198, 0.08)";
  const ACTIVE_STROKE = "rgba(232, 81, 156, 0.95)";
  const ACTIVE_FILL = "rgba(232, 81, 156, 0.12)";

  const el = {
    tmpl: document.getElementById("tmpl"),
    boxWrap: document.getElementById("boxWrap"),
    box: document.getElementById("box"),
    file: document.getElementById("file"),
    undo: document.getElementById("undo"),
    reset: document.getElementById("reset"),
    copy: document.getElementById("copy"),
    status: document.getElementById("status"),
    points: document.getElementById("points"),
    yaml: document.getElementById("yaml"),
    empty: document.getElementById("empty"),
    stage: document.getElementById("stage"),
    img: document.getElementById("img"),
    overlay: document.getElementById("overlay"),
    main: document.getElementById("main"),
  };

  /** @type {{x:number,y:number}[]} */
  let pts = [];
  /** @type {{name:string,kind:string,corners:{x:number,y:number}[],source?:string,angle?:number}[]} */
  let areas = [];
  let activeIdx = 0;
  let objectUrl = null;

  function currentMode() {
    const r = document.querySelector('input[name="mode"]:checked');
    return r ? r.value : "quad";
  }

  function needed() {
    return currentMode() === "para" ? 3 : 4;
  }

  function impliedBR(tl, tr, bl) {
    return {
      x: tl.x + (tr.x - tl.x) + (bl.x - tl.x),
      y: tl.y + (tr.y - tl.y) + (bl.y - tl.y),
    };
  }

  function fmt(n) {
    return n.toFixed(2);
  }

  function setMode(mode) {
    const r = document.querySelector(`input[name="mode"][value="${mode}"]`);
    if (r) r.checked = true;
  }

  function yamlOut() {
    if (currentMode() === "para") {
      if (pts.length < 3) return "";
      const [tl, tr, bl] = pts;
      return [
        "quad:",
        `  - [${fmt(tl.x)}, ${fmt(tl.y)}] # top-left`,
        `  - [${fmt(tr.x)}, ${fmt(tr.y)}] # top-right`,
        `  - [${fmt(bl.x)}, ${fmt(bl.y)}] # bottom-left (3-pt → BR implied)`,
      ].join("\n");
    }
    if (pts.length < 4) return "";
    const lines = ["quad:"];
    pts.forEach((p, i) => {
      lines.push(`  - [${fmt(p.x)}, ${fmt(p.y)}] # ${LABELS_QUAD[i]}`);
    });
    return lines.join("\n");
  }

  function loadActiveIntoPts() {
    const area = areas[activeIdx];
    if (!area || !area.corners || area.corners.length < 3) {
      pts = [];
      return;
    }
    const c = area.corners.map((p) => ({ x: p.x, y: p.y }));
    if (currentMode() === "para") {
      pts = [c[0], c[1], c[3] || c[2]];
    } else {
      pts = c.slice(0, 4);
      if (pts.length === 3) {
        pts = [c[0], c[1], impliedBR(c[0], c[1], c[2]), c[2]];
      }
    }
  }

  function syncActiveFromPts() {
    if (!areas[activeIdx]) return;
    if (currentMode() === "para" && pts.length >= 3) {
      const br = impliedBR(pts[0], pts[1], pts[2]);
      areas[activeIdx].corners = [pts[0], pts[1], br, pts[2]];
      areas[activeIdx].kind = "quad";
      areas[activeIdx].source = "3pt";
    } else if (pts.length >= 4) {
      areas[activeIdx].corners = pts.slice(0, 4);
      areas[activeIdx].kind = "quad";
      areas[activeIdx].source = "4pt";
    }
  }

  function updateUI() {
    const mode = currentMode();
    if (!el.img.src) {
      el.status.innerHTML = "Load a template — existing write areas are drawn automatically.";
    } else if (mode === "para") {
      if (pts.length < 3) {
        el.status.innerHTML = `Click <strong>${LABELS_PARA[pts.length]}</strong> (${pts.length}/3).`;
      } else {
        const br = impliedBR(pts[0], pts[1], pts[2]);
        el.status.innerHTML = `3-pt complete — implied BR (${fmt(br.x)}, ${fmt(br.y)}). Drag to nudge.`;
      }
    } else if (pts.length < 4) {
      el.status.innerHTML = `Click <strong>${LABELS_QUAD[pts.length]}</strong> (${pts.length}/4).`;
    } else {
      const n = areas.length;
      const name = areas[activeIdx] ? areas[activeIdx].name || `#${activeIdx}` : "area";
      el.status.innerHTML = n > 1
        ? `Editing <strong>${name}</strong> (${activeIdx + 1}/${n}). Drag handles to nudge.`
        : "Quad loaded from config. Drag handles to nudge, or Reset.";
    }

    const labels = mode === "para" ? LABELS_PARA : LABELS_QUAD;
    el.points.textContent = pts
      .map((p, i) => `${(labels[i] || `p${i}`).padEnd(14)} (${fmt(p.x)}, ${fmt(p.y)})`)
      .join("\n");
    el.yaml.value = yamlOut();
    draw();
  }

  function syncCanvasSize() {
    const r = el.img.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    el.overlay.width = Math.round(r.width * dpr);
    el.overlay.height = Math.round(r.height * dpr);
    el.overlay.style.width = `${r.width}px`;
    el.overlay.style.height = `${r.height}px`;
    draw();
  }

  function drawRing(ctx, ring, stroke, fill, lineW) {
    if (ring.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(ring[0].x, ring[0].y);
    for (let i = 1; i < ring.length; i++) ctx.lineTo(ring[i].x, ring[i].y);
    ctx.closePath();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineW;
    ctx.stroke();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
  }

  function draw() {
    const ctx = el.overlay.getContext("2d");
    const w = el.overlay.width;
    const h = el.overlay.height;
    ctx.clearRect(0, 0, w, h);
    const toPx = (p) => ({ x: p.x * w, y: p.y * h });
    const lineW = Math.max(2, w * 0.003);
    const fontPx = Math.max(11, w * 0.016);

    // All configured areas (inactive first).
    areas.forEach((area, i) => {
      if (i === activeIdx) return;
      const ring = (area.corners || []).map(toPx);
      if (ring.length < 3) return;
      drawRing(ctx, ring, OTHER_STROKE, OTHER_FILL, lineW);
      const label = area.name || `box ${i}`;
      ctx.fillStyle = "rgba(61, 214, 198, 0.9)";
      ctx.font = `${fontPx}px sans-serif`;
      ctx.textBaseline = "top";
      ctx.fillText(label, ring[0].x + 4, ring[0].y + 4);
    });

    // Active editable pts (or fall back to area corners while incomplete).
    let ring = [];
    const mode = currentMode();
    const px = pts.map(toPx);
    if (mode === "para" && pts.length >= 3) {
      ring = [px[0], px[1], toPx(impliedBR(pts[0], pts[1], pts[2])), px[2]];
    } else if (pts.length >= 4) {
      ring = px.slice(0, 4);
    } else if (areas[activeIdx] && areas[activeIdx].corners && areas[activeIdx].corners.length >= 3 && pts.length === 0) {
      ring = areas[activeIdx].corners.map(toPx);
    } else {
      ring = px.slice();
    }

    if (ring.length >= 2) {
      const closed = ring.length >= 3 && (pts.length >= needed() || (pts.length === 0 && areas[activeIdx]));
      ctx.beginPath();
      ctx.moveTo(ring[0].x, ring[0].y);
      for (let i = 1; i < ring.length; i++) ctx.lineTo(ring[i].x, ring[i].y);
      if (closed) ctx.closePath();
      ctx.strokeStyle = ACTIVE_STROKE;
      ctx.lineWidth = lineW;
      ctx.stroke();
      if (closed) {
        ctx.fillStyle = ACTIVE_FILL;
        ctx.fill();
      }
      if (areas[activeIdx] && areas[activeIdx].name) {
        ctx.fillStyle = ACTIVE_STROKE;
        ctx.font = `600 ${fontPx}px sans-serif`;
        ctx.textBaseline = "top";
        ctx.fillText(areas[activeIdx].name, ring[0].x + 4, ring[0].y + 4);
      }
    }

    const short = mode === "para" ? ["TL", "TR", "BL"] : ["TL", "TR", "BR", "BL"];
    px.forEach((p, i) => {
      const r = Math.max(5, w * 0.008);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = `${fontPx}px sans-serif`;
      ctx.textBaseline = "bottom";
      ctx.fillText(short[i] || String(i), p.x + r + 2, p.y - 2);
    });
  }

  function eventToNorm(ev) {
    const rect = el.overlay.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width)),
      y: Math.min(1, Math.max(0, (ev.clientY - rect.top) / rect.height)),
    };
  }

  function populateBoxSelect() {
    el.box.innerHTML = "";
    if (areas.length === 0) {
      el.boxWrap.hidden = true;
      return;
    }
    el.boxWrap.hidden = areas.length < 2;
    areas.forEach((a, i) => {
      const o = document.createElement("option");
      o.value = String(i);
      o.textContent = a.name ? `${a.name} (${a.source || a.kind})` : `box ${i} (${a.source || a.kind})`;
      el.box.appendChild(o);
    });
    el.box.value = String(activeIdx);
  }

  function selectArea(idx) {
    activeIdx = Math.max(0, Math.min(idx, Math.max(0, areas.length - 1)));
    const area = areas[activeIdx];
    if (area && area.source === "3pt") setMode("para");
    else setMode("quad");
    loadActiveIntoPts();
    populateBoxSelect();
    updateUI();
  }

  let dragIdx = -1;

  el.overlay.addEventListener("pointerdown", (ev) => {
    if (!el.img.src) return;
    el.overlay.setPointerCapture(ev.pointerId);
    const hit = eventToNorm(ev);
    const rect = el.overlay.getBoundingClientRect();
    const thresh = 12 / rect.width;
    dragIdx = pts.findIndex((p) => Math.hypot(p.x - hit.x, p.y - hit.y) < thresh);
    if (dragIdx >= 0) return;
    if (pts.length >= needed()) return;
    pts.push(hit);
    syncActiveFromPts();
    updateUI();
  });

  el.overlay.addEventListener("pointermove", (ev) => {
    if (dragIdx < 0) return;
    pts[dragIdx] = eventToNorm(ev);
    syncActiveFromPts();
    updateUI();
  });

  el.overlay.addEventListener("pointerup", () => {
    dragIdx = -1;
  });

  function showStage() {
    el.empty.hidden = true;
    el.stage.hidden = false;
    el.img.onload = () => {
      syncCanvasSize();
      updateUI();
    };
  }

  function loadImage(url) {
    if (objectUrl) {
      URL.revokeObjectURL(objectUrl);
      objectUrl = null;
    }
    el.img.src = url;
    showStage();
  }

  async function loadTemplate(id, image) {
    areas = [];
    activeIdx = 0;
    pts = [];
    try {
      const res = await fetch(`/api/templates/${encodeURIComponent(id)}`);
      if (res.ok) {
        const data = await res.json();
        areas = data.areas || [];
      }
    } catch (_) {
      /* image-only fallback */
    }
    populateBoxSelect();
    if (areas.length) selectArea(0);
    else {
      pts = [];
      updateUI();
    }
    loadImage(`/templates/${encodeURIComponent(id)}/${encodeURIComponent(image)}`);
  }

  el.tmpl.addEventListener("change", () => {
    const id = el.tmpl.value;
    if (!id) return;
    const opt = el.tmpl.selectedOptions[0];
    loadTemplate(id, opt.dataset.image);
  });

  el.box.addEventListener("change", () => {
    selectArea(parseInt(el.box.value, 10) || 0);
  });

  el.file.addEventListener("change", () => {
    const f = el.file.files && el.file.files[0];
    if (!f) return;
    objectUrl = URL.createObjectURL(f);
    el.tmpl.value = "";
    areas = [];
    activeIdx = 0;
    pts = [];
    populateBoxSelect();
    loadImage(objectUrl);
  });

  el.main.addEventListener("dragover", (ev) => ev.preventDefault());
  el.main.addEventListener("drop", (ev) => {
    ev.preventDefault();
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f || !f.type.startsWith("image/")) return;
    objectUrl = URL.createObjectURL(f);
    el.tmpl.value = "";
    el.file.value = "";
    areas = [];
    activeIdx = 0;
    pts = [];
    populateBoxSelect();
    loadImage(objectUrl);
  });

  document.querySelectorAll('input[name="mode"]').forEach((r) => {
    r.addEventListener("change", () => {
      loadActiveIntoPts();
      if (!areas.length) pts = [];
      updateUI();
    });
  });

  el.undo.addEventListener("click", () => {
    pts.pop();
    syncActiveFromPts();
    updateUI();
  });
  el.reset.addEventListener("click", () => {
    pts = [];
    if (areas[activeIdx]) areas[activeIdx].corners = [];
    updateUI();
  });
  el.copy.addEventListener("click", async () => {
    const text = el.yaml.value;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      el.status.innerHTML = "<strong>Copied</strong> YAML to clipboard.";
    } catch {
      el.yaml.select();
      el.status.textContent = "Clipboard failed — copy from the textarea.";
    }
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.target.matches("input, textarea, select")) return;
    const k = ev.key.toLowerCase();
    if (k === "u") {
      pts.pop();
      syncActiveFromPts();
      updateUI();
    } else if (k === "r") {
      pts = [];
      if (areas[activeIdx]) areas[activeIdx].corners = [];
      updateUI();
    } else if (k === "c" && !ev.metaKey && !ev.ctrlKey) {
      el.copy.click();
    }
  });

  window.addEventListener("resize", () => {
    if (el.img.src) syncCanvasSize();
  });

  fetch("/api/templates")
    .then((r) => r.json())
    .then((list) => {
      el.tmpl.innerHTML = '<option value="">— pick template —</option>';
      for (const t of list) {
        const o = document.createElement("option");
        o.value = t.id;
        o.textContent = t.id;
        o.dataset.image = t.image;
        el.tmpl.appendChild(o);
      }
      const q = new URLSearchParams(location.search).get("t");
      if (q && list.some((t) => t.id === q)) {
        el.tmpl.value = q;
        el.tmpl.dispatchEvent(new Event("change"));
      }
    })
    .catch(() => {
      el.status.textContent = "Template list unavailable — drop an image instead.";
    });

  updateUI();
})();
</script>
</body>
</html>
